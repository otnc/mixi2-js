version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    # Wait a week before proposing a new release, so a compromised or broken version has time to be pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript is upgraded by hand.
      - dependency-name: typescript
      # @types/node follows the minimum supported Node.js line (20.19).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Tests still run on Node.js 20.19 (the minimum in engines.node), which vitest dropped in v5.
      - dependency-name: vitest
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /pages
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      pages:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/examples/*"]
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      examples:
        patterns: ["*"]
    ignore:
      # The examples always install the latest published SDK.
      - dependency-name: mixi2-js

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
