name: pr-title

# Pull requests are squash-merged, so the title becomes the commit message on main and the changelog entry. This checks it with the same commitlint config as the commit-msg hook.
# pull_request_target checks out the base branch, so the config and dependencies come from main, never from the pull request.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # The title goes through an environment variable so it is never interpreted by the shell.
      - run: printf '%s\n' "$TITLE" | npx --no -- commitlint --verbose
        env:
          TITLE: ${{ github.event.pull_request.title }}
