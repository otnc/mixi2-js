name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Changes that only touch the docs site, Markdown or images skip the build and tests. The workflow itself always runs so that the required "ci" check is reported.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a force push has no usable base, so everything is checked.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(pages/|img/)|\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package

  # The SDK supports Node.js 20.19 and later (engines.node), while the development tools need the version in .nvmrc, so only the tests run across the supported range.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["20.19.0", 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Runs the built package on each runtime (scripts/runtime-smoke): Node.js, Bun and Deno against a local TLS gRPC server, Cloudflare Workers on workerd through Wrangler. Features listed as supported in the README must pass.
  runtimes:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno, workers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build
      - name: Start the test gRPC server
        if: matrix.runtime != 'workers'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem"
          node scripts/runtime-smoke/server.mjs "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" > "$RUNNER_TEMP/port" &
          for _ in $(seq 1 20); do [ -s "$RUNNER_TEMP/port" ] && break; sleep 0.5; done
          echo "GRPC_ADDRESS=localhost:$(cat "$RUNNER_TEMP/port")" >> "$GITHUB_ENV"
          echo "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=$RUNNER_TEMP/cert.pem" >> "$GITHUB_ENV"
      - name: Smoke test
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          case "$RUNTIME" in
            node) node scripts/runtime-smoke/smoke.mjs ;;
            bun) bun scripts/runtime-smoke/smoke.mjs ;;
            deno) deno run --allow-all scripts/runtime-smoke/smoke.mjs ;;
            workers) node scripts/runtime-smoke/workers.mjs ;;
          esac

  # Documentation can leak secrets too, so the scan runs for every change.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks GitHub Action needs a license key for organization repositories, so run the CLI image directly.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  # The single required check. Skipped jobs count as passing; a failed or cancelled job fails it.
  ci:
    needs: [changes, check, test, runtimes, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A required job ended with: ${result}"
                exit 1
                ;;
            esac
          done
