name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: a semver bump (patch/minor/major/prerelease) or an explicit version (e.g. 1.6.0)"
        required: true
        default: patch
      dist_tag:
        description: 'npm dist-tag to publish under. Leave empty to auto-detect: the prerelease identifier (e.g. "beta" from 2.0.0-beta.0), or "latest" for a stable version.'
        required: false
        default: ""

# npm and JSR both authenticate this workflow via OIDC, so no publish token secret is needed. Configure npm first: package Settings -> Publishing access -> Trusted publishers -> GitHub.
permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing and JSR publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The version commit is pushed with the app token so that a main ruleset can let only this app bypass it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run typecheck
      - run: npm test

      - name: Bump version
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("fs");
            const jsr = JSON.parse(fs.readFileSync("jsr.json", "utf8"));
            jsr.version = process.argv[1];
            fs.writeFileSync("jsr.json", JSON.stringify(jsr, null, 2) + "\n");
          ' "$NEW"
          npx prettier --write jsr.json
          echo "version=v${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "::notice::Version is already ${NEW}; skipping the bump but still releasing."
          fi

          if [[ "$NEW" == *-* ]]; then
            REST="${NEW#*-}"
            PRERELEASE_ID="${REST%%.*}"
          else
            PRERELEASE_ID=""
          fi

          TAG="$DIST_TAG_INPUT"
          if [ -z "$TAG" ]; then
            if [ -n "$PRERELEASE_ID" ]; then TAG="$PRERELEASE_ID"; else TAG="latest"; fi
          fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ "$TAG" = "latest" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      # The build runs after the bump so dist matches the published version.
      - run: npm run build
      - run: npm run check:package

      # The new section is generated from Conventional Commits and inserted above the hand-written history in CHANGELOG.md.
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.bump.outputs.version }}
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Update CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const section = fs.readFileSync("RELEASE_NOTES.md", "utf8").trim();
            if (!section) process.exit(0);
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const firstVersion = changelog.indexOf("\n## ");
            const insertAt = firstVersion === -1 ? changelog.length : firstVersion + 1;
            fs.writeFileSync("CHANGELOG.md", changelog.slice(0, insertAt) + section + "\n\n" + changelog.slice(insertAt));
          '

      # Trusted publishing needs npm 11.5 or later, which exchanges the GitHub OIDC token for a short-lived publish credential.
      - run: npm install -g npm@11
      # Skipping versions that are already published lets a failed release be re-run to finish the remaining steps.
      - name: Publish to npm
        env:
          NPM_TAG: ${{ steps.bump.outputs.npm_tag }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on npm; skipping publish."
          else
            npm publish --access public --provenance --tag "$NPM_TAG"
          fi

      - name: Publish to JSR
        run: |
          NAME="$(node -p "require('./jsr.json').name")"
          VERSION="$(node -p "require('./jsr.json').version")"
          if curl -fsSL "https://jsr.io/${NAME}/meta.json" | node -e '
            let body = "";
            process.stdin.on("data", (chunk) => (body += chunk));
            process.stdin.on("end", () => process.exit(JSON.parse(body).versions[process.argv[1]] ? 0 : 1));
          ' "$VERSION"; then
            echo "::notice::${NAME}@${VERSION} is already on JSR; skipping publish."
          else
            # The bumped version files are committed only after both registries accept the release.
            npx --yes jsr publish --allow-dirty
          fi

      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.bump.outputs.version }}
          # npm ci installs the commit-msg hook, which rejects the reserved release: type.
          SKIP_SIMPLE_GIT_HOOKS: "1"
        run: |
          BOT_ID="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add package.json package-lock.json jsr.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "release: ${VERSION}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            git tag "${VERSION}"
          fi
          git push origin HEAD "${VERSION}"

      - name: Create GitHub Release
        env:
          # A release created with GITHUB_TOKEN would not trigger the announce-release workflow.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release ${VERSION} already exists."
          elif [ -s RELEASE_NOTES.md ]; then
            # The release body is the changelog section minus its version heading.
            sed '1d' RELEASE_NOTES.md > RELEASE_BODY.md
            gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_BODY.md "${FLAGS[@]}"
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes "${FLAGS[@]}"
          fi
